services:
  - type: web
    name: sentinel-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIORITY
        value: gemini-2.5-flash,gemini-2.0-flash,gemini-1.5-flash
